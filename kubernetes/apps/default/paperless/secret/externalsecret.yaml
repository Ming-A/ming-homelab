---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-secret
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: secret/paperless
        property: PAPERLESS_SECRET_KEY
    - secretKey: PAPERLESS_ADMIN_USER
      remoteRef:
        key: secret/paperless
        property: PAPERLESS_ADMIN_USER
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: secret/paperless
        property: PAPERLESS_ADMIN_PASSWORD
    - secretKey: PAPERLESS_ADMIN_MAIL
      remoteRef:
        key: secret/paperless
        property: PAPERLESS_ADMIN_MAIL
    - secretKey: PAPERLESS_URL
      remoteRef:
        key: secret/paperless
        property: PAPERLESS_URL
    - secretKey: NFS_PATH
      remoteRef:
        key: secret/paperless
        property: NFS_PATH
