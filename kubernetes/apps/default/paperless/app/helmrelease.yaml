---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  dependsOn: [{name: paperless-redis}]
  chartRef:
    kind: OCIRepository
    name: paperless
  interval: 1h
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.3
            env:
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: Asia/Kuala_Lumpur
              PAPERLESS_REDIS: redis://paperless-redis:6379
              PAPERLESS_OCR_LANGUAGES: msa chi-sim
              PAPERLESS_OCR_LANGUAGE: eng+msa+chi_sim
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_EXPORT_DIR: /usr/src/paperless/export
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /usr/src/paperless/data
      media:
        type: nfs
        server: ${NFS_SERVER}
        path: ${NFS_PATH}/media
        globalMounts:
          - path: /usr/src/paperless/media
      consume:
        type: nfs
        server: ${NFS_SERVER}
        path: ${NFS_PATH}/consume
        globalMounts:
          - path: /usr/src/paperless/consume
      export:
        type: nfs
        server: ${NFS_SERVER}
        path: ${NFS_PATH}/export
        globalMounts:
          - path: /usr/src/paperless/export
